<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <meta name="description" content="DRIFT 12.3 — a generative cloud visualiser that responds to music locally in your browser." />
  <title>DRIFT 12.3 — Generative Music Visualiser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="vignette"></div>

  <main id="ui" class="ui visible">
    <section class="panel" id="landing">
      <div class="brand">DRIFT 12.3</div>
      <h1>GENERATIVE CLOUD VISUALISER</h1>
      <p class="lede">Choose music from your device. The file stays local: nothing is uploaded.</p>

      <label class="fileButton" for="fileInput">CHOOSE MUSIC</label>
      <input id="fileInput" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg" />
      <p id="fileName" class="filename">No track loaded</p>

      <div class="transport">
        <button id="playBtn" class="iconButton" disabled aria-label="Play">▶</button>
        <button id="loopBtn" class="iconButton" aria-label="Loop" aria-pressed="false">↻</button>
        <button id="shuffleBtn" class="iconButton" aria-label="Regenerate journey">⤨</button>
        <button id="fullBtn" class="iconButton" aria-label="Fullscreen">⛶</button>
      </div>

      <div class="timelineRow">
        <span id="timeNow">0:00</span>
        <input id="seek" type="range" min="0" max="1" value="0" step="0.01" disabled />
        <span id="timeTotal">0:00</span>
      </div>

      <details class="settings">
        <summary>VISUAL SETTINGS</summary>
        <label><span>Visual intensity</span><input id="intensity" type="range" min="0.5" max="1.25" value="1" step="0.01" /></label>
        <label><span>Forward motion</span><input id="speed" type="range" min="0.65" max="1.45" value="1" step="0.01" /></label>
        <label><span>Grain</span><input id="grain" type="range" min="0" max="1.8" value="1" step="0.01" /></label>
      </details>

      <div class="statusLine">
        <span id="status">Waiting for music</span>
        <span id="scene">BLUE SKY</span>
      </div>
      <p class="hint">Tap/click the visual to hide or show controls.</p>
    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
